name: Release

# Push a tag like v0.2.0 to publish that version to nuget.org and create a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # nuget.org trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/GitPa -c Release -p:Version="${GITHUB_REF_NAME#v}" -p:ContinuousIntegrationBuild=true

      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
